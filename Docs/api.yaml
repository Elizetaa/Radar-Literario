  "info": {
    "description": "API Go/Gin/GORM com persistência MariaDB. IDs são inteiros positivos; datas civis usam YYYY-MM-DD e instantes usam RFC3339 em UTC. JSON de escrita rejeita campos desconhecidos. Listas têm paginação estável e limitada. Perfil, status e classificação etária são reavaliados no servidor. Publicações protegidas retornam metadados com title/text/data_url nulos até confirmação explícita; idade nunca é contornada. Não há verificação documental de nascimento nem verificação de e-mail nesta versão.\n\nSessão opaca em cookie HttpOnly. Obtenha GET /api/v1/auth/csrf antes de escrever: visitante recebe cookie de pré-autenticação e token; usuário autenticado recebe token ligado à sessão. Envie X-CSRF-Token em todas as escritas e preserve cookies. Login substitui a sessão e retorna novo token; logout/troca/recuperação revogam sessões. Origin deve estar nas listas configuradas; CORS permite somente origens explícitas. Cookie Secure é obrigatório em produção.\n\nPapéis: catalog_manager mantém catálogo; user_manager modera, atende suporte e mantém FAQ; administrator reúne os dois; system_administrator também gerencia administradores. Nenhum administrador pode banir outro administrador. A descrição das operações identifica a permissão necessária. Nome do cookie é configurável; este contrato registra o default local.\n\nGeração: em Backend, go run ./cmd/openapi -out ../Docs/api.yaml. O documento é JSON válido, também aceito como YAML 1.2.",
    "title": "Radar Literário — API",
    "version": "1.0.0"
  },
