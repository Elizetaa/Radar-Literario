services:

  #Container de Banco de Dados
  data:
    image: mariadb:13
    container_name: banco_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      #- ./data/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  migrate:
    build: ./Backend
    command: ["/app/migrate", "-command", "up"]
    restart: "no"
    env_file: ./Backend/.env
    environment:
      DB_HOST: data
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      OUTBOX_ENCRYPTION_KEY: ${OUTBOX_ENCRYPTION_KEY}
    depends_on:
      data:
        condition: service_healthy
    networks: [internal]

  back:
    build: ./Backend
    restart: unless-stopped
    environment:
      DB_HOST: data
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      OUTBOX_ENCRYPTION_KEY: ${OUTBOX_ENCRYPTION_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  front:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [back]
    networks: [internal]

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:

networks:
  internal: